name: Terraform QA → PROD (Auto Promotion)

on:
  push:
    branches:
      - qa   
  workflow_dispatch:

jobs:

# =========================
# QA DEPLOY
# =========================
  deploy-qa:
    name: Deploy QA Environment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (QA)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          aws-region: us-east-1

      - name: Terraform Init QA
        run: terraform init -reconfigure

      - name: Terraform Validate QA
        run: terraform validate

      - name: Terraform Plan QA
        run: terraform plan -out=tfplan

      - name: Terraform Apply QA
        run: terraform apply -auto-approve tfplan

      - name: QA Outputs Evidence
        run: terraform output


# =========================
# PROD DEPLOY (AUTO DESPUÉS DE QA)
# =========================
  deploy-prod:
    name: Deploy PROD Environment
    runs-on: ubuntu-latest
    needs: deploy-qa   

    defaults:
      run:
        working-directory: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (PROD)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1

      - name: Terraform Init PROD
        run: terraform init -reconfigure

      - name: Terraform Validate PROD
        run: terraform validate

      - name: Terraform Plan PROD
        run: terraform plan -out=tfplan

      - name: Terraform Apply PROD
        run: terraform apply -auto-approve tfplan

      - name: PROD Outputs Evidence
        run: terraform output