name: Terraform CD - QA y PROD

on:
  push:
    branches:
      - qa

jobs:

  terraform-qa:
    name: Desplegar Infraestructura QA
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: qa

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Credenciales AWS QA
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN_QA }}
          aws-region: us-east-1

      - name: Terraform Init QA
        run: terraform init

      - name: Terraform Validate QA
        run: terraform validate

      - name: Terraform Plan QA
        run: terraform plan -out=tfplan

      - name: Terraform Apply QA
        run: terraform apply -auto-approve tfplan

  terraform-prod:
    name: Desplegar Infraestructura PROD
    runs-on: ubuntu-latest

    needs: terraform-qa

    defaults:
      run:
        working-directory: prod

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Credenciales AWS PROD
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN_PROD }}
          aws-region: us-east-1

      - name: Terraform Init PROD
        run: terraform init

      - name: Terraform Validate PROD
        run: terraform validate

      - name: Terraform Plan PROD
        run: terraform plan -out=tfplan

      - name: Terraform Apply PROD
        run: terraform apply -auto-approve tfplan

      - name: Mostrar Outputs
        run: terraform output