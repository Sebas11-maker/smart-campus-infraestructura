name: Terraform QA → PROD (Unified Push)

on:
  push:
    branches:
      - qa # Se dispara únicamente al enviar cambios a la rama qa
  workflow_dispatch:

jobs:
# =========================
# QA DEPLOY
# =========================
  deploy-qa:
    name: Deploy QA Environment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (QA)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN_QA }} # Requisito de AWS Academy
          aws-region: us-east-1

      - name: Configurar e Instalar Terraform en el Runner
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0" # Asegura una versión estable y moderna

      - name: Terraform Init QA
        run: terraform init -reconfigure

      - name: Terraform Validate QA
        run: terraform validate

      - name: Terraform Plan QA
        run: terraform plan -out=tfplan

      - name: Terraform Apply QA
        run: terraform apply -auto-approve tfplan

      - name: QA Outputs Evidence
        run: terraform output

# =========================
# PROD DEPLOY (SE EJECUTA INMEDIATAMENTE DESPUÉS)
# =========================
  deploy-prod:
    name: Deploy PROD Environment
    runs-on: ubuntu-latest
    needs: deploy-qa # Garantiza que primero termine QA con éxito

    defaults:
      run:
        working-directory: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (PROD)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN_PROD }} # Requisito de AWS Academy
          aws-region: us-east-1

      - name: Configurar e Instalar Terraform en el Runner
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init PROD
        run: terraform init -reconfigure

      - name: Terraform Validate PROD
        run: terraform validate

      - name: Terraform Plan PROD
        run: terraform plan -out=tfplan

      - name: Terraform Apply PROD
        run: terraform apply -auto-approve tfplan

      - name: PROD Outputs Evidence
        run: terraform output