name: 'Terraform CD - Entorno QA'
on:
  push:
    branches: [ qa ] # Solo se activa al empujar a la rama de QA

jobs:
  terraform-qa:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: hashicorp/setup-terraform@v2

    - name: Configurar Credenciales Lab QA
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN_QA }}
        aws-region: us-east-1

    - name: Desplegar en QA
      run: |
        cd qa
        terraform init -input=false
        terraform apply -auto-approve